<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BabySentinel Manager</title>
<style>
:root {
  --bg:      #0f1117;
  --card:    #1a1d27;
  --border:  #2a2d3a;
  --text:    #e8eaf0;
  --muted:   #6b7280;
  --green:   #22c55e;
  --red:     #ef4444;
  --yellow:  #f59e0b;
  --blue:    #3b82f6;
  --radius:  10px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--text); font-family: system-ui, sans-serif;
  height: 100vh;
  height: 100dvh;
  display: flex; flex-direction: column; overflow: hidden;
}

header {
  padding: 12px 20px; background: var(--card);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 12px;
}
header h1 { font-size: 1rem; font-weight: 600; flex: 1; }
.header-link { font-size: 0.82rem; color: var(--blue); text-decoration: none; }
.header-link:hover { text-decoration: underline; }

.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  grid-auto-rows: minmax(240px, 1fr);
  gap: 14px; padding: 16px;
  flex: 1; min-height: 0;
  overflow-y: auto;
  align-content: start;
}

.card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius); display: flex; flex-direction: column;
  overflow: hidden;
}

.card-head {
  padding: 12px 14px 10px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: flex-start; gap: 10px;
}
.card-icon { font-size: 1.5rem; line-height: 1; }
.card-info { flex: 1; min-width: 0; }
.card-name { font-weight: 600; font-size: 0.95rem; }
.card-desc { font-size: 0.75rem; color: var(--muted); margin-top: 2px; }

.status-row {
  display: flex; align-items: center; gap: 8px; margin-top: 6px;
}
.dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.dot.running  { background: var(--green); box-shadow: 0 0 6px var(--green); animation: pulse 1.8s infinite; }
.dot.stopped  { background: var(--muted); }
.dot.crashed  { background: var(--red); }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

.status-text { font-size: 0.78rem; color: var(--muted); }
.status-text.running { color: var(--green); }
.status-text.crashed { color: var(--red); }
.pid-text { font-size: 0.72rem; color: var(--muted); margin-left: auto; }

.card-btns {
  display: flex; gap: 6px; padding: 8px 14px;
  border-bottom: 1px solid var(--border);
}
.btn {
  flex: 1; padding: 5px 0; border-radius: 6px; border: 1px solid var(--border);
  background: none; color: var(--text); cursor: pointer; font-size: 0.8rem;
  transition: background .15s, border-color .15s;
}
.btn:hover { background: var(--border); }
.btn.start:hover        { background: #14532d; border-color: var(--green); color: var(--green); }
.btn.stop:hover         { background: #450a0a; border-color: var(--red);   color: var(--red); }
.btn.restart:hover      { background: #1e3a5f; border-color: var(--blue);  color: var(--blue); }
.btn.check-update:hover { background: #1f2937; border-color: #6b7280;      color: #d1d5db; }
.btn.update:hover       { background: #4d3008; border-color: #f59e0b;      color: #f59e0b; }
.btn:disabled { opacity: .4; cursor: default; }

.update-badge {
  margin: 0 14px 6px;
  padding: 4px 8px; border-radius: 4px;
  background: #4d3008; border: 1px solid #f59e0b; color: #fbbf24;
  font-size: 0.72rem; font-family: monospace;
}

/* ── 配置弹窗 ───────────────────────────────────────── */
.modal-mask {
  position: fixed; inset: 0; z-index: 50;
  background: rgba(0,0,0,.55);
  display: flex; align-items: center; justify-content: center;
}
.modal-panel {
  width: min(560px, 92vw); max-height: 85vh;
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius);
  display: flex; flex-direction: column;
  box-shadow: 0 8px 32px rgba(0,0,0,.6);
}
.modal-head {
  padding: 12px 16px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px;
}
.modal-head .title { flex: 1; font-weight: 600; font-size: 0.95rem; }
.modal-head .close {
  background: none; border: none; color: var(--muted); font-size: 1.2rem;
  cursor: pointer; padding: 0 6px;
}
.modal-body {
  padding: 14px 16px; flex: 1; overflow-y: auto;
}
.modal-foot {
  padding: 10px 16px; border-top: 1px solid var(--border);
  display: flex; gap: 8px; align-items: center;
}
.modal-foot .msg { flex: 1; font-size: 0.78rem; color: var(--muted); }
.modal-foot .msg.ok  { color: var(--green); }
.modal-foot .msg.err { color: var(--red); }
.modal-foot .btn { flex: 0 0 auto; padding: 6px 14px; }
.modal-foot .btn.save:hover { background: #14532d; border-color: var(--green); color: var(--green); }

.cfg-row {
  display: flex; flex-direction: column; gap: 4px;
  margin-bottom: 14px; font-size: 0.83rem;
}
.cfg-row .lbl  { color: var(--text); font-weight: 500; }
.cfg-row .hint { color: var(--muted); font-size: 0.72rem; }
.cfg-row input[type=text],
.cfg-row input[type=number],
.cfg-row input[type=password],
.cfg-row select,
.cfg-row textarea {
  background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
  color: var(--text); padding: 6px 9px; font-size: 0.85rem; font-family: inherit;
  width: 100%; outline: none;
}
.cfg-row textarea { resize: vertical; min-height: 60px; font-family: monospace; }
.cfg-row input:focus, .cfg-row select:focus, .cfg-row textarea:focus {
  border-color: var(--blue);
}
.cfg-row.bool { flex-direction: row; align-items: center; gap: 10px; }
.cfg-row.bool .lbl { flex: 1; }
.cfg-row.bool input { width: auto; }

@media (max-width: 768px) {
  .modal-panel { width: 96vw; max-height: 90vh; }
}

.log-box {
  flex: 1; min-height: 0;
  background: #0a0c12; font-family: monospace; font-size: 0.8rem;
  color: #9ca3af; overflow-y: auto;
  padding: 8px 10px; line-height: 1.5;
  scrollbar-width: thin; scrollbar-color: var(--border) transparent;
}
.log-box .ts { color: #4b5563; }

/* ── 手机响应式：< 768px 切单列 + 页面可纵向滚动 ─────────────────── */
@media (max-width: 768px) {
  body {
    height: auto;
    min-height: 100vh;
    min-height: 100dvh;
    overflow: auto;
    -webkit-overflow-scrolling: touch;
  }
  header {
    padding: 10px 14px;
    gap: 8px;
    position: sticky; top: 0; z-index: 10;
  }
  header h1 { font-size: 0.9rem; }
  .header-link { font-size: 0.75rem; }
  .grid {
    grid-template-columns: 1fr;
    grid-template-rows: none;
    flex: none;
    gap: 10px;
    padding: 10px;
  }
  .card { min-height: 280px; }
  .log-box {
    flex: none;
    max-height: 180px;
    font-size: 0.72rem;
  }
}
</style>
</head>
<body>

<header>
  <h1 data-i18n="mgrTitle">🛠 BabySentinel Manager</h1>
  <a class="header-link" id="link-main" href="#" data-i18n="mgrLinkMain">→ 主界面</a>
  <a class="header-link" id="link-playback" href="#" data-i18n="mgrLinkPlayback">→ 回放</a>
</header>

<div class="grid" id="grid"></div>

<!-- 配置编辑弹窗 -->
<div id="cfg-modal" class="modal-mask" style="display:none">
  <div class="modal-panel">
    <div class="modal-head">
      <span class="title" id="cfg-modal-title">⚙ Settings</span>
      <button class="close" onclick="closeConfig()">✕</button>
    </div>
    <div class="modal-body" id="cfg-modal-body"></div>
    <div class="modal-foot">
      <span class="msg" id="cfg-modal-msg"></span>
      <button class="btn"      onclick="closeConfig()" data-i18n="cfgCancel">取消</button>
      <button class="btn save" onclick="saveConfig()"  data-i18n="cfgSave">保存</button>
    </div>
  </div>
</div>

<!-- BLE 配对弹窗 -->
<div id="pair-modal" class="modal-mask" style="display:none">
  <div class="modal-panel">
    <div class="modal-head">
      <span class="title" data-i18n="pairTitle">BLE 配对</span>
      <button class="close" onclick="closePair()">✕</button>
    </div>
    <div class="modal-body">
      <ol id="pair-steps" style="padding-left:20px;line-height:1.7;font-size:0.85rem;color:var(--text)">
        <li data-i18n="pairStep1">长按设备按钮两次（约 1 秒间隔）</li>
        <li data-i18n="pairStep2">看到蓝灯慢闪后，点击下方"开始配对"</li>
        <li data-i18n="pairStep3">配对过程约 30s，期间 BLE 服务会临时停掉</li>
      </ol>
      <pre id="pair-log" style="display:none;margin-top:12px;background:#0a0c12;color:#9ca3af;
        font-family:monospace;font-size:0.72rem;padding:8px 10px;border-radius:6px;
        max-height:240px;overflow-y:auto;white-space:pre-wrap;word-break:break-all"></pre>
    </div>
    <div class="modal-foot">
      <span class="msg" id="pair-msg"></span>
      <button class="btn"      onclick="closePair()" data-i18n="cfgCancel">取消</button>
      <button class="btn save" id="pair-go-btn" onclick="doPair()" data-i18n="pairBtnStart">开始配对</button>
    </div>
  </div>
</div>

<!-- LANGS 字典 -->
<script src="/static/config.js?v=__CFG_VER__"></script>

<script>
const lang = navigator.language.startsWith('ja') ? 'ja' : 'zh';
// 用 Proxy 兜底：缺失的 key 返回空字符串，避免在模板拼接出 "undefined"
const T = new Proxy(LANGS[lang], { get: (obj, k) => obj[k] ?? '' });

function applyI18n(root) {
  (root || document).querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.dataset.i18n;
    if (LANGS[lang][key] !== undefined) el.textContent = LANGS[lang][key];
  });
}
applyI18n();

(function() {
  const base = `http://${location.hostname}:__WEB_PORT__`;
  document.getElementById('link-main').href     = base + '/';
  document.getElementById('link-playback').href = base + '/playback';
})();

// 服务列表完全从 API 动态生成，无需在前端硬编码
let _svcOrder   = [];  // 首次 poll 后填充
let _autoScroll = {};  // svc → bool
let _updateInfo = {};  // svc → { update_available, behind, latest_commit }

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderCard(svc, data) {
  const el = document.getElementById(`card-${svc}`);
  if (!el) return;

  const st    = data.status;
  const dotCl = st === 'running' ? 'running' : st === 'crashed' ? 'crashed' : 'stopped';
  const stLbl = st === 'running' ? T.mgrStatusRunning
              : st === 'crashed' ? T.mgrStatusCrashed
                                 : T.mgrStatusStopped;

  el.querySelector('.dot').className        = `dot ${dotCl}`;
  el.querySelector('.status-text').className  = `status-text ${dotCl}`;
  el.querySelector('.status-text').textContent = stLbl
    + (data.started_at ? `  ${data.started_at}` : '');
  el.querySelector('.pid-text').textContent = data.pid ? `PID ${data.pid}` : '';

  const startBtn   = el.querySelector('.btn.start');
  const stopBtn    = el.querySelector('.btn.stop');
  const restartBtn = el.querySelector('.btn.restart');
  startBtn.disabled   = st === 'running';
  stopBtn.disabled    = st === 'stopped';
  restartBtn.disabled = false;

  // 配对（目前只 BLE 有）：是否渲染配对按钮
  const pairBtn = el.querySelector('.btn.pair');
  if (pairBtn) pairBtn.style.display = data.pairable ? '' : 'none';

  // 远端 git 服务：渲染更新按钮 + 可用 badge
  const checkBtn  = el.querySelector('.btn.check-update');
  const updateBtn = el.querySelector('.btn.update');
  const badge     = el.querySelector('.update-badge');
  if (data.git) {
    checkBtn.style.display  = '';
    updateBtn.style.display = '';
    const u = _updateInfo[svc];
    if (u && u.update_available) {
      badge.style.display = '';
      badge.textContent = `↑ ${u.behind} new — ${u.latest_commit}`;
      updateBtn.disabled = false;
    } else {
      badge.style.display = 'none';
      updateBtn.disabled = !(u && u.update_available);
      // 还没查过：允许点 update（会先隐式确认），但灰一点
      if (!u) updateBtn.disabled = true;
    }
  } else {
    if (checkBtn)  checkBtn.style.display  = 'none';
    if (updateBtn) updateBtn.style.display = 'none';
    if (badge)     badge.style.display     = 'none';
  }

  if (data.desc) {
    const descEl = el.querySelector('.card-desc');
    if (descEl) descEl.textContent = data.desc;
  }

  // Logs
  const box  = el.querySelector('.log-box');
  const logs = data.logs || [];
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 30;

  box.innerHTML = logs.map(line => {
    const m = line.match(/^(\d{2}:\d{2}:\d{2})\s+(.*)/s);
    if (m) return `<div><span class="ts">${m[1]}</span>  ${escHtml(m[2])}</div>`;
    return `<div>${escHtml(line)}</div>`;
  }).join('');

  if (_autoScroll[svc] !== false && atBottom) {
    box.scrollTop = box.scrollHeight;
  }
}

function buildCard(svc, meta) {
  const div = document.createElement('div');
  div.className = 'card';
  div.id = `card-${svc}`;
  div.innerHTML = `
    <div class="card-head">
      <div class="card-icon">${meta.icon}</div>
      <div class="card-info">
        <div class="card-name">${escHtml(meta.name)}</div>
        <div class="card-desc">${escHtml(meta.desc || '—')}</div>
        <div class="status-row">
          <div class="dot stopped"></div>
          <span class="status-text stopped">${T.mgrStatusStopped}</span>
          <span class="pid-text"></span>
        </div>
      </div>
    </div>
    <div class="card-btns">
      <button class="btn start"        onclick="action('${svc}','start')">${T.mgrBtnStart}</button>
      <button class="btn stop"         onclick="action('${svc}','stop')">${T.mgrBtnStop}</button>
      <button class="btn restart"      onclick="action('${svc}','restart')">${T.mgrBtnRestart}</button>
      <button class="btn config"       onclick="openConfig('${svc}')">${T.mgrBtnConfig}</button>
      <button class="btn pair"         style="display:none" onclick="openPair()">${T.mgrBtnPair}</button>
      <button class="btn check-update" style="display:none" onclick="checkUpdate('${svc}')">${T.mgrBtnCheck}</button>
      <button class="btn update"       style="display:none" onclick="doUpdate('${svc}')">${T.mgrBtnUpdate}</button>
    </div>
    <div class="update-badge" style="display:none"></div>
    <div class="log-box"></div>
  `;
  div.querySelector('.log-box').addEventListener('scroll', function() {
    _autoScroll[svc] = this.scrollHeight - this.scrollTop - this.clientHeight < 30;
  });
  return div;
}

const grid = document.getElementById('grid');

async function poll() {
  try {
    const res  = await fetch('/api/manager/status');
    const data = await res.json();

    // 首次 poll：根据 API 返回的服务列表动态建卡
    if (_svcOrder.length === 0) {
      _svcOrder = Object.keys(data);
      _svcOrder.forEach(svc => {
        _autoScroll[svc] = true;
        grid.appendChild(buildCard(svc, data[svc]));
      });
    }

    _svcOrder.forEach(svc => {
      if (data[svc]) renderCard(svc, data[svc]);
    });
  } catch(_) {}
}

async function action(svc, cmd) {
  try {
    await fetch(`/api/manager/${svc}/${cmd}`, { method: 'POST' });
    setTimeout(poll, 300);
  } catch(_) {}
}

async function checkUpdate(svc) {
  try {
    const r = await fetch(`/api/manager/${svc}/check_update`);
    const d = await r.json();
    if (!d.ok) {
      alert(`${T.mgrUpdateFail}: ${d.error || '?'}`);
      return;
    }
    _updateInfo[svc] = d;
    if (d.update_available) {
      alert(`${T.mgrUpdateAvail}: ${d.behind}\n${d.latest_commit}`);
    } else {
      alert(T.mgrUpdateNone);
    }
    setTimeout(poll, 100);
  } catch(e) {
    alert(`${T.mgrUpdateFail}: ${e}`);
  }
}

async function doUpdate(svc) {
  if (!confirm(T.mgrUpdateConfirm)) return;
  try {
    const r = await fetch(`/api/manager/${svc}/update`, { method: 'POST' });
    const d = await r.json();
    if (!d.ok) {
      alert(`${T.mgrUpdateFail} (${d.step}): ${(d.log || '').slice(-300)}`);
      return;
    }
    _updateInfo[svc] = { update_available: false, behind: 0, latest_commit: '' };
    setTimeout(poll, 500);
  } catch(e) {
    alert(`${T.mgrUpdateFail}: ${e}`);
  }
}

// ──────────────────────────────────────────────────────────────
//  配置编辑弹窗
// ──────────────────────────────────────────────────────────────
//
// 每个 card 一份 schema：字段 → 标签 (zh/ja) + 类型。修改时记得同步 config.example.json。
// 类型: string / password / int / number / bool / enum / array_str / array_int
// key 支持 dotted-path（如 baby.name），后端按层级写回。

const CONFIG_SCHEMA = {
  go2rtc: [
    { key: 'tapo_rtsp', type: 'password',
      label: { zh: 'Tapo RTSP URL', ja: 'Tapo RTSP URL' },
      hint:  { zh: 'rtsp://user:pass@192.168.x.x:554/stream1',
               ja: 'rtsp://user:pass@192.168.x.x:554/stream1' } },
    { key: 'pi_audio_rtsp', type: 'string',
      label: { zh: 'Pi 音频 RTSP（可选）', ja: 'Pi 音声 RTSP（任意）' } },
    { key: 'go2rtc_port', type: 'int',
      label: { zh: 'go2rtc 端口', ja: 'go2rtc ポート' } },
    { key: 'go2rtc_path', type: 'string',
      label: { zh: 'go2rtc 可执行路径', ja: 'go2rtc バイナリパス' } },
  ],
  ble: [
    { key: 'pi_host', type: 'string',
      label: { zh: 'Pi 主机地址', ja: 'Pi ホストアドレス' } },
    { key: 'pi_ssh_user', type: 'string',
      label: { zh: 'Pi SSH 用户名', ja: 'Pi SSH ユーザー' } },
    { key: 'pi_ssh_key', type: 'string',
      label: { zh: 'Pi SSH 私钥路径', ja: 'Pi SSH 秘密鍵パス' } },
    { key: 'ble_port', type: 'int',
      label: { zh: 'sense-u-ble 端口', ja: 'sense-u-ble ポート' } },
    { key: 'ble_poll_interval_s', type: 'number',
      label: { zh: 'BLE 轮询间隔 (秒)', ja: 'BLE ポーリング間隔 (秒)' } },
    { key: 'ble_health_timeout_s', type: 'number',
      label: { zh: 'BLE 心跳超时 (秒)', ja: 'BLE ハートビートタイムアウト (秒)' } },
  ],
  server: [
    { key: 'web_port', type: 'int',
      label: { zh: 'Web 端口', ja: 'Web ポート' } },
    { key: 'language', type: 'enum',
      label: { zh: '界面语言', ja: '言語' },
      options: [{ value: 'zh', label: { zh: '中文', ja: '中国語' } },
                { value: 'ja', label: { zh: '日文', ja: '日本語' } }] },
    { key: 'log_level', type: 'enum',
      label: { zh: '日志级别', ja: 'ログレベル' },
      options: ['DEBUG','INFO','WARNING','ERROR'].map(v => ({ value: v, label: { zh: v, ja: v } })) },
    { key: 'alert_notify_enabled', type: 'bool',
      label: { zh: '启用告警推送（Discord/Bark/QQ）',
               ja: 'アラート通知を有効化（Discord/Bark/QQ）' } },
    { key: 'baby.name', type: 'string',
      label: { zh: '宝宝姓名', ja: '赤ちゃんの名前' } },
    { key: 'baby.birth_date', type: 'string',
      label: { zh: '出生日期 (YYYYMMDD)', ja: '誕生日 (YYYYMMDD)' } },
    { key: 'baby.weight_g', type: 'int',
      label: { zh: '出生体重 (g)', ja: '出生体重 (g)' } },
    { key: 'baby.feed_type', type: 'enum',
      label: { zh: '喂养方式', ja: '授乳方式' },
      options: [
        { value: 'formula', label: { zh: '配方奶', ja: 'ミルク' } },
        { value: 'breast',  label: { zh: '母乳',   ja: '母乳' } },
        { value: 'mixed',   label: { zh: '混合',   ja: '混合' } },
      ] },
    { key: 'baby.feed_interval_min', type: 'int',
      label: { zh: '喂奶间隔 (分钟)', ja: '授乳間隔 (分)' } },
    { key: 'discord_token', type: 'password',
      label: { zh: 'Discord Bot Token', ja: 'Discord Bot Token' } },
    { key: 'discord_channel_ids', type: 'array_int',
      label: { zh: 'Discord 频道 ID（每行一个）', ja: 'Discord チャンネル ID（1 行 1 つ）' } },
    { key: 'discord_user_ids', type: 'array_int',
      label: { zh: 'Discord 用户 ID（每行一个）', ja: 'Discord ユーザー ID（1 行 1 つ）' } },
    { key: 'bark_server_url', type: 'string',
      label: { zh: 'Bark 服务器 URL', ja: 'Bark サーバー URL' } },
    { key: 'bark_keys', type: 'array_str',
      label: { zh: 'Bark Key（每行一个）', ja: 'Bark Key（1 行 1 つ）' } },
  ],
  recorder: [
    { key: 'segment_s', type: 'int',
      label: { zh: '录像分段时长 (秒)', ja: '録画セグメント長 (秒)' } },
    { key: 'ffmpeg_path', type: 'string',
      label: { zh: 'ffmpeg 可执行路径', ja: 'ffmpeg バイナリパス' } },
  ],
  voice: [
    { key: 'voice_service_url', type: 'string',
      label: { zh: 'Voice 服务 URL', ja: 'Voice サービス URL' } },
    { key: 'voice_service_port', type: 'int',
      label: { zh: 'Voice 服务端口', ja: 'Voice サービスポート' } },
    { key: 'wake_threshold', type: 'number',
      label: { zh: '唤醒阈值 (0–1)', ja: 'ウェイクしきい値 (0–1)' } },
    { key: 'wake_confirm_frames', type: 'int',
      label: { zh: '唤醒确认帧数', ja: 'ウェイク確認フレーム数' } },
    { key: 'wake_peak_threshold', type: 'number',
      label: { zh: '唤醒峰值阈值 (0–1)', ja: 'ウェイクピークしきい値 (0–1)' } },
    { key: 'wake_cooldown_s', type: 'number',
      label: { zh: '唤醒冷却 (秒)', ja: 'ウェイククールダウン (秒)' } },
    { key: 'voice_silence_rms', type: 'number',
      label: { zh: '静音 RMS', ja: '無音 RMS' } },
    { key: 'voice_silence_s', type: 'number',
      label: { zh: '静音持续 (秒)', ja: '無音継続 (秒)' } },
    { key: 'voice_max_record_s', type: 'number',
      label: { zh: '最大录音时长 (秒)', ja: '最大録音時間 (秒)' } },
  ],
};

function _l(obj) { return (obj && (obj[lang] ?? obj.zh)) || ''; }
function _getPath(obj, path) {
  return path.split('.').reduce((o, k) => (o == null ? undefined : o[k]), obj);
}

let _cfgSvc  = null;
let _cfgData = null;

function fieldHtml(f, val) {
  const id    = `cfg-${f.key.replace(/\./g, '_')}`;
  const label = _l(f.label);
  const hint  = f.hint ? `<div class="hint">${escHtml(_l(f.hint))}</div>` : '';

  if (f.type === 'bool') {
    return `<label class="cfg-row bool">
      <span class="lbl">${escHtml(label)}</span>
      <input type="checkbox" id="${id}" ${val ? 'checked' : ''}>
    </label>${hint ? `<div class="cfg-row">${hint}</div>` : ''}`;
  }

  if (f.type === 'enum') {
    const opts = (f.options || []).map(o =>
      `<option value="${escHtml(o.value)}" ${o.value === val ? 'selected' : ''}>${escHtml(_l(o.label))}</option>`
    ).join('');
    return `<label class="cfg-row">
      <span class="lbl">${escHtml(label)}</span>
      <select id="${id}">${opts}</select>
      ${hint}
    </label>`;
  }

  if (f.type === 'array_str' || f.type === 'array_int') {
    const text = Array.isArray(val) ? val.join('\n') : '';
    return `<label class="cfg-row">
      <span class="lbl">${escHtml(label)}</span>
      <textarea id="${id}" rows="3">${escHtml(text)}</textarea>
      ${hint}
    </label>`;
  }

  const inputType = f.type === 'password' ? 'password'
                   : (f.type === 'int' || f.type === 'number') ? 'number'
                   : 'text';
  const step = f.type === 'number' ? 'step="any"' : f.type === 'int' ? 'step="1"' : '';
  return `<label class="cfg-row">
    <span class="lbl">${escHtml(label)}</span>
    <input type="${inputType}" id="${id}" value="${escHtml(val ?? '')}" ${step}>
    ${hint}
  </label>`;
}

function readField(f) {
  const id = `cfg-${f.key.replace(/\./g, '_')}`;
  const el = document.getElementById(id);
  if (!el) return undefined;
  if (f.type === 'bool') return el.checked;
  if (f.type === 'enum') return el.value;
  if (f.type === 'array_str') {
    return el.value.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
  }
  if (f.type === 'array_int') {
    return el.value.split(/\r?\n/).map(s => s.trim()).filter(Boolean)
                   .map(Number).filter(n => !Number.isNaN(n));
  }
  if (f.type === 'int') {
    if (el.value === '') return null;
    const n = parseInt(el.value, 10);
    return Number.isNaN(n) ? null : n;
  }
  if (f.type === 'number') {
    if (el.value === '') return null;
    const n = parseFloat(el.value);
    return Number.isNaN(n) ? null : n;
  }
  return el.value;
}

async function openConfig(svc) {
  const fields = CONFIG_SCHEMA[svc];
  if (!fields) { alert(T.cfgNoSchema); return; }
  let cfg;
  try {
    const r = await fetch('/api/manager/config');
    const d = await r.json();
    if (!d.ok) throw new Error(d.error || '?');
    cfg = d.config;
  } catch (e) {
    alert(`${T.cfgLoadFail}: ${e.message || e}`);
    return;
  }
  _cfgSvc  = svc;
  _cfgData = cfg;

  const meta = document.getElementById(`card-${svc}`);
  const name = meta ? meta.querySelector('.card-name').textContent : svc;
  document.getElementById('cfg-modal-title').textContent = `${T.cfgTitle} — ${name}`;
  document.getElementById('cfg-modal-body').innerHTML =
    fields.map(f => fieldHtml(f, _getPath(cfg, f.key))).join('');
  document.getElementById('cfg-modal-msg').textContent = '';
  document.getElementById('cfg-modal-msg').className = 'msg';
  document.getElementById('cfg-modal').style.display = '';
}

function closeConfig() {
  document.getElementById('cfg-modal').style.display = 'none';
  _cfgSvc = _cfgData = null;
}

async function saveConfig() {
  if (!_cfgSvc) return;
  const fields = CONFIG_SCHEMA[_cfgSvc] || [];
  const patch = {};
  fields.forEach(f => {
    const v = readField(f);
    if (v !== undefined) patch[f.key] = v;
  });

  const msg = document.getElementById('cfg-modal-msg');
  try {
    const r = await fetch('/api/manager/config', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ patch }),
    });
    const d = await r.json();
    if (!d.ok) throw new Error(d.error || '?');
  } catch (e) {
    msg.textContent = `${T.cfgSaveFail}: ${e.message || e}`;
    msg.className = 'msg err';
    return;
  }

  msg.textContent = T.cfgSaved;
  msg.className = 'msg ok';

  // 提示用户手动重启对应服务
  const meta = document.getElementById(`card-${_cfgSvc}`);
  const name = meta ? meta.querySelector('.card-name').textContent : _cfgSvc;
  const ask = (T.cfgRestartHint || 'Restart {svc}?').replace('{svc}', name);
  if (confirm(ask)) {
    await action(_cfgSvc, 'restart');
  }
  closeConfig();
}

// ──────────────────────────────────────────────────────────────
//  BLE 配对（一次性获取 baby_code）
// ──────────────────────────────────────────────────────────────

function openPair() {
  document.getElementById('pair-log').style.display = 'none';
  document.getElementById('pair-log').textContent  = '';
  const msg = document.getElementById('pair-msg');
  msg.textContent = '';
  msg.className   = 'msg';
  const btn = document.getElementById('pair-go-btn');
  btn.disabled    = false;
  btn.textContent = T.pairBtnStart;
  document.getElementById('pair-modal').style.display = '';
}

function closePair() {
  document.getElementById('pair-modal').style.display = 'none';
}

async function doPair() {
  const btn    = document.getElementById('pair-go-btn');
  const msg    = document.getElementById('pair-msg');
  const logBox = document.getElementById('pair-log');

  btn.disabled    = true;
  btn.textContent = T.pairWorking;
  msg.textContent = T.pairWorking;
  msg.className   = 'msg';
  logBox.style.display = 'none';
  logBox.textContent   = '';

  try {
    // 配对内嵌 ssh 链路总耗时 < 70s，前端 fetch 不另设超时（默认网关够用）
    const r = await fetch('/api/manager/ble/pair', { method: 'POST' });
    const d = await r.json();
    if (d.log) {
      logBox.style.display = '';
      logBox.textContent   = d.log;
    }
    if (d.ok) {
      msg.textContent = T.pairOk;
      msg.className   = 'msg ok';
      btn.textContent = T.pairBtnAgain;
    } else {
      msg.textContent = `${T.pairFail}${d.step ? ' (' + d.step + ')' : ''}`;
      msg.className   = 'msg err';
      btn.textContent = T.pairBtnAgain;
    }
  } catch (e) {
    msg.textContent = `${T.pairFail}: ${e.message || e}`;
    msg.className   = 'msg err';
    btn.textContent = T.pairBtnAgain;
  } finally {
    btn.disabled = false;
    setTimeout(poll, 500);  // 刷新 BLE card 状态（service 已被重启）
  }
}

poll();
setInterval(poll, 2000);
</script>
