<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BabySentinel</title>
<style>
:root {
  --bg:      #0f1117;
  --surface: #1a1d27;
  --border:  #2a2d3a;
  --text:    #e8eaf0;
  --muted:   #6b7280;
  --green:   #22c55e;
  --blue:    #3b82f6;
  --yellow:  #f59e0b;
  --red:     #ef4444;
  --radius:  10px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--text); font-family: system-ui, sans-serif;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  display: flex; flex-direction: column;
}

/* ── Header ── */
header {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 16px; background: var(--surface);
  border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.back-btn {
  background: none; border: 1px solid var(--border); color: var(--text);
  padding: 5px 12px; border-radius: 6px; cursor: pointer; font-size: 0.85rem;
}
.back-btn:hover { background: var(--border); }
header h1 { font-size: 1rem; font-weight: 600; flex: 1; }
.date-select {
  background: var(--bg); border: 1px solid var(--border); color: var(--text);
  padding: 5px 10px; border-radius: 6px; font-size: 0.85rem; cursor: pointer;
}

/* ── Layout ── */
.content { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; padding: 12px; overflow: hidden; }
.right-col { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; overflow: hidden; }

/* ── Video ── */
.video-wrap {
  position: relative; background: #000; border-radius: var(--radius);
  overflow: hidden; flex-shrink: 0;
  aspect-ratio: 16/9; max-height: 35dvh;
  width: 100%;
}
video { width: 100%; height: 100%; display: block; object-fit: contain; }
.video-placeholder {
  position: absolute; inset: 0; display: flex; align-items: center;
  justify-content: center; color: var(--muted); font-size: 0.9rem;
}

/* Sensor overlay on video */
.sensor-bar {
  position: absolute; bottom: 0; left: 0; right: 0;
  background: linear-gradient(transparent, rgba(0,0,0,.75));
  padding: 20px 14px 10px;
  display: flex; gap: 16px; flex-wrap: wrap; pointer-events: none;
  justify-content: center;
}
.s-item { font-size: 0.78rem; color: #e8eaf0; white-space: nowrap; }
.s-item .val { font-weight: 600; color: #fff; }
.s-time {
  position: absolute; top: 8px; right: 10px;
  font-size: 0.82rem; font-family: 'Courier New', monospace;
  color: #fff; text-shadow: 0 0 4px rgba(0,0,0,.9);
  letter-spacing: 0.5px; pointer-events: none; text-align: right;
}
.s-time .tc-date { font-size: 0.7rem; opacity: .75; display: block; }
.s-time .tc-time { font-weight: 700; }

/* ── Sensor panel ── */
.sensor-panel {
  background: var(--surface); border-radius: var(--radius);
  border: 1px solid var(--border); padding: 10px 14px;
  display: flex; gap: 20px; flex-wrap: wrap; flex-shrink: 0;
}
.sp-item { display: flex; flex-direction: column; gap: 2px; }
.sp-label { font-size: 0.7rem; color: var(--muted); }
.sp-value { font-size: 1rem; font-weight: 600; }
.sp-value.warn { color: var(--yellow); }
.sp-value.danger { color: var(--red); }

/* ── Timeline ── */
.timeline-wrap {
  background: var(--surface); border-radius: var(--radius);
  border: 1px solid var(--border); padding: 12px 14px;
  flex: 1; min-height: 0;
  display: flex; flex-direction: column; gap: 10px;
}
.timeline-label {
  font-size: 0.75rem; color: var(--muted);
  flex-shrink: 0;
  display: flex; justify-content: space-between; align-items: center;
}

/* Quick jump bar —— 两行 grid，第一行段级跳转，第二行相对时间跳转 */
.quickjump {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 4px; flex-shrink: 0;
}
.qj-btn {
  padding: 7px 4px;
  background: var(--bg); color: var(--text);
  border: 1px solid var(--border); border-radius: 6px;
  font-size: 0.72rem; font-family: monospace; cursor: pointer;
  transition: background .15s, border-color .15s;
  white-space: nowrap;
}
.qj-btn:hover  { background: var(--blue); border-color: var(--blue); color: #fff; }
.qj-btn:active { transform: scale(.96); }
.qj-btn:disabled {
  opacity: .35; cursor: not-allowed;
  background: var(--bg); border-color: var(--border); color: var(--muted);
}

/* Timeline rail —— 渐变背景 + inner shadow + 内部横向滚动 */
.tl-rail {
  position: relative;
  flex: 1; min-height: 100px;
  background: linear-gradient(180deg, #0a0c12 0%, #050608 100%);
  border-radius: 8px;
  border: 1px solid #1d2030;
  box-shadow: inset 0 1px 3px rgba(0,0,0,.5);
  user-select: none;
  overflow-x: auto;
  overflow-y: hidden;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}
.tl-rail::-webkit-scrollbar { height: 6px; }
.tl-rail::-webkit-scrollbar-thumb {
  background: var(--border); border-radius: 3px;
}

/* 内层容器 —— 24h 拉伸到 3 倍 rail 宽度，让每段录像看得清，可横向滑动浏览 */
.tl-content {
  position: relative;
  width: 300%;
  min-width: 1800px;
  height: 100%;
}

/* 时间刻度区：minor 每 1h（细线无字），major 每 6h（粗线带字） */
.tl-hours {
  position: absolute; top: 0; left: 0; right: 0; height: 28px;
  border-bottom: 1px solid #1a1d2c;
}
.tl-hour-label {
  position: absolute; top: 0;
  font-size: 0;
  pointer-events: none;
}
.tl-hour-label::after {
  content: ''; position: absolute; top: 22px; left: 0;
  width: 1px; height: 4px; background: #2c3142;
}
.tl-hour-label.major {
  top: 6px;
  font-size: 0.72rem; font-weight: 700;
  color: var(--muted);
  font-family: monospace;
  transform: translateX(-50%);
  white-space: nowrap;
}
.tl-hour-label.major::after {
  top: 18px; left: 50%;
  width: 1.5px; height: 6px;
  background: #4b5366;
  transform: translateX(-50%);
}

/* 段 row：渐变蓝、相邻段视觉融合，有"已录像彩带"质感 */
.tl-segs {
  position: absolute; top: 32px; left: 0; right: 0; height: 18px;
  background: rgba(255,255,255,.025);
  border-radius: 2px;
  margin: 0 1px;
}
.tl-seg {
  position: absolute; top: 0; height: 100%; min-width: 2px;
  background: linear-gradient(180deg, #2563eb 0%, #1e40af 100%);
  opacity: .75;
  cursor: pointer;
  transition: opacity .15s, box-shadow .15s, transform .15s;
}
.tl-seg:hover  {
  opacity: 1;
  box-shadow: 0 0 8px rgba(59,130,246,.7);
  z-index: 2;
}
.tl-seg.active {
  background: linear-gradient(180deg, #93c5fd 0%, #2563eb 100%);
  opacity: 1;
  box-shadow: 0 0 12px rgba(147,197,253,.95), inset 0 0 4px rgba(255,255,255,.4);
  z-index: 3;
}

/* 事件 row：emoji 带圆形深底徽章，对比更强 */
.tl-events {
  position: absolute; top: 56px; left: 0; right: 0; bottom: 4px;
}
.tl-evt {
  position: absolute; top: 2px;
  width: 22px; height: 22px;
  font-size: 0.95rem; line-height: 22px;
  text-align: center;
  border-radius: 50%;
  background: rgba(20,24,38,.85);
  border: 1px solid #1d2030;
  cursor: pointer; user-select: none;
  transform: translateX(-50%);
  box-shadow: 0 2px 4px rgba(0,0,0,.4);
  transition: transform .15s, background .15s, box-shadow .15s;
}
.tl-evt:hover {
  transform: translateX(-50%) scale(1.5);
  background: rgba(59,130,246,.5);
  box-shadow: 0 0 8px rgba(59,130,246,.7);
  z-index: 5;
}

/* 当前播放红线 —— 可拖拽 scrub */
.tl-now {
  position: absolute; top: 28px; bottom: 0;
  width: 18px; margin-left: -8px;   /* 实际宽 18px 用作拖拽热区，视觉红线居中 */
  cursor: ew-resize;
  pointer-events: auto;
  z-index: 4;
  transition: left .2s linear;
  touch-action: none;                /* 阻止 touch 触发横向滚动 */
}
.tl-now.scrubbing { transition: none; }   /* drag 时禁用过渡，跟随手指 */

/* 红线（::before）*/
.tl-now::before {
  content: '';
  position: absolute; top: 12px; bottom: 8px; left: 8px;
  width: 2px;
  background: linear-gradient(180deg, transparent 0, var(--red) 8px, var(--red) calc(100% - 8px), transparent 100%);
  pointer-events: none;
}
/* 红色脉动圆点（::after）*/
.tl-now::after {
  content: '';
  position: absolute; top: 4px; left: 4px;
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--red);
  box-shadow: 0 0 8px rgba(239,68,68,.9);
  animation: pulse-now 1.5s infinite;
  pointer-events: none;
}
.tl-now.scrubbing::after { animation: none; transform: scale(1.3); }

/* 时间气泡（独立 child element，drag 时切蓝色 + 加粗） */
.tl-now-bubble {
  position: absolute; top: -22px; left: 50%;
  transform: translateX(-50%);
  background: var(--red);
  color: #fff;
  font-size: 0.66rem; font-weight: 700; font-family: monospace;
  padding: 2px 6px;
  border-radius: 3px;
  white-space: nowrap;
  box-shadow: 0 2px 6px rgba(0,0,0,.6);
  letter-spacing: 0.3px;
  pointer-events: none;
}
.tl-now.scrubbing .tl-now-bubble {
  background: var(--blue);
  font-size: 0.78rem;
  padding: 3px 8px;
  box-shadow: 0 2px 8px rgba(59,130,246,.7);
}

@keyframes pulse-now {
  0%, 100% { transform: scale(1);   opacity: 1;   }
  50%      { transform: scale(1.3); opacity: .75; }
}

/* Counter under rail */
.tl-counter {
  font-size: 0.7rem; color: var(--muted);
  flex-shrink: 0;
  display: flex; gap: 12px; flex-wrap: wrap;
}
.tl-counter span { white-space: nowrap; }

/* Empty state */
.empty { text-align: center; color: var(--muted); padding: 40px; font-size: 0.9rem; }

@media (min-width: 700px) {
  .content { flex-direction: row; flex-wrap: nowrap; align-items: stretch; }
  .video-wrap { flex: 2; min-width: 0; max-height: none; }
  .right-col { flex: 1; min-width: 240px; }
}
</style>
</head>
<body>

<header>
  <button class="back-btn" onclick="location.href='/'" data-i18n="pbBack">戻る</button>
  <h1 data-i18n="pbTitle">📹 再生</h1>
  <select class="date-select" id="date-sel" onchange="loadDate(this.value)">
    <option value="" data-i18n="pbSelectDatePrompt">日付を選択...</option>
  </select>
</header>

<div class="content" id="content">
  <div class="empty" id="empty-msg" data-i18n="pbSelectDatePrompt">日付を選択してください</div>
</div>

<template id="tpl-player">
  <div class="video-wrap" id="video-wrap">
    <video id="vid" preload="auto" controls></video>
    <div class="video-placeholder" id="vid-placeholder" data-i18n="pbSelectSegment">片段を選択してください</div>
    <div class="s-time" id="sb-time">
      <span class="tc-date" id="sb-date"></span>
      <span class="tc-time" id="sb-clock">--:--:--</span>
    </div>
    <div class="sensor-bar" id="sensor-bar" style="display:none">
      <div class="s-item">💨 <span class="val" id="sb-breath">--</span> <span data-i18n="unitBpm">回/min</span></div>
      <div class="s-item">🌡️ <span class="val" id="sb-temp">--</span> °C</div>
      <div class="s-item">🛏️ <span class="val" id="sb-posture">--</span></div>
      <div class="s-item">🔋 <span class="val" id="sb-battery">--</span>%</div>
    </div>
  </div>

  <div class="right-col">
    <div class="sensor-panel">
      <div class="sp-item"><div class="sp-label" data-i18n="labelBreath">💨 呼吸数</div><div class="sp-value" id="sp-breath">--</div></div>
      <div class="sp-item"><div class="sp-label" data-i18n="labelTemp">🌡️ 衣内温度</div><div class="sp-value" id="sp-temp">--</div></div>
      <div class="sp-item"><div class="sp-label" data-i18n="labelPosture">🛏️ 姿勢</div><div class="sp-value" id="sp-posture">--</div></div>
      <div class="sp-item"><div class="sp-label" data-i18n="labelBattery">🔋 バッテリー</div><div class="sp-value" id="sp-battery">--</div></div>
      <div class="sp-item"><div class="sp-label" data-i18n="pbVidTime">🎬 映像時刻</div><div class="sp-value" id="sp-vidts" style="font-size:.85rem;font-family:monospace">--</div></div>
    </div>

    <div class="timeline-wrap">
      <div class="timeline-label">
        <span data-i18n="pbTimelineLabel">📍 タイムライン</span>
        <span id="tl-pos-label" style="font-family:monospace;color:var(--blue)">--:--</span>
      </div>

      <div class="quickjump">
        <button class="qj-btn" id="qj-first" onclick="jumpFirst()" data-i18n="pbQjFirst">⏮ 最初</button>
        <button class="qj-btn" id="qj-prev"  onclick="jumpPrevSeg()" data-i18n="pbQjPrev">⬅ 上段</button>
        <button class="qj-btn" id="qj-next"  onclick="jumpNextSeg()" data-i18n="pbQjNext">下段 ➡</button>
        <button class="qj-btn" id="qj-last"  onclick="jumpLast()"  data-i18n="pbQjLast">最新 ⏭</button>
        <button class="qj-btn" onclick="jumpRel(-6*3600)">-6h</button>
        <button class="qj-btn" onclick="jumpRel(-3600)">-1h</button>
        <button class="qj-btn" onclick="jumpRel(3600)">+1h</button>
        <button class="qj-btn" onclick="jumpRel(6*3600)">+6h</button>
      </div>

      <div class="tl-rail" id="tl-rail">
        <div class="tl-content" id="tl-content">
          <div class="tl-hours" id="tl-hours"></div>
          <div class="tl-segs" id="tl-segs"></div>
          <div class="tl-events" id="tl-events"></div>
          <div class="tl-now" id="tl-now" style="display:none">
            <div class="tl-now-bubble" id="tl-now-bubble">--:--:--</div>
          </div>
        </div>
      </div>

      <div class="tl-counter" id="tl-counter"></div>
    </div>
  </div>
</template>

<!-- 常数配置（LANGS 等） -->
<script src="/static/config.js?v=__CFG_VER__"></script>

<script>
const $ = id => document.getElementById(id);

const lang = navigator.language.startsWith('ja') ? 'ja' : 'zh';
// 用 Proxy 兜底：缺失的 key 返回空字符串，避免在模板拼接出 "undefined"
const T = new Proxy(LANGS[lang], { get: (obj, k) => obj[k] ?? '' });

function applyI18n(root) {
  (root || document).querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.dataset.i18n;
    if (LANGS[lang][key] !== undefined) el.textContent = LANGS[lang][key];
  });
}
applyI18n();
document.title = 'BabySentinel - ' + (T.pbTitle || '').replace(/^[\u{1F300}-\u{1FAFF}]\s*/u, '');

let _segments = [];
let _sensors  = [];
let _events   = [];
let _curIdx   = -1;
let _curDate  = '';
let _blePollS = 2;     // ble_poll_interval_s 兜底值；启动后由 /api/config/public 覆盖
const SEG_S   = 360;   // 默认 6 分钟一段；不影响 timeline 渲染（只用来推估宽度）

// ── Time helpers ──────────────────────────────────────────────────────
function pad2(n) { return String(n).padStart(2, '0'); }
function fmtTs(unixTs) {
  const d = new Date(unixTs * 1000);
  return `${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`;
}
function fmtTsHM(unixTs) {
  const d = new Date(unixTs * 1000);
  return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
}
function fmtDate(unixTs) {
  const d = new Date(unixTs * 1000);
  return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
}
function dayStart(dateStr) {
  // dateStr e.g. "2026-05-03" → unix ts of local 00:00
  return new Date(dateStr + 'T00:00:00').getTime() / 1000;
}
function tsToPercent(ts, dateStr) {
  return ((ts - dayStart(dateStr)) / 86400) * 100;
}

// ── Update video timecode (independent of sensor data) ────────────────
function setTimecode(realTs) {
  if ($('sb-date'))      $('sb-date').textContent     = fmtDate(realTs);
  if ($('sb-clock'))     $('sb-clock').textContent    = fmtTs(realTs);
  if ($('sp-vidts'))     $('sp-vidts').textContent    = fmtTs(realTs);
  if ($('tl-pos-label')) $('tl-pos-label').textContent = fmtTs(realTs);
}

// ── Binary search nearest sensor entry ────────────────────────────────
function nearestSensor(ts) {
  if (!_sensors.length) return null;
  let lo = 0, hi = _sensors.length - 1;
  while (lo < hi) {
    const mid = (lo + hi) >> 1;
    if (_sensors[mid].ts < ts) lo = mid + 1; else hi = mid;
  }
  if (lo > 0 && Math.abs(_sensors[lo-1].ts - ts) < Math.abs(_sensors[lo].ts - ts)) lo--;
  return _sensors[lo];
}

// ── Posture / sensor display ──────────────────────────────────────────
function fmtPosture(p) {
  if (!p) return '--';
  return (T.postures && T.postures[p]) || p;
}

function renderSensor(s) {
  if (!s) return;
  const breath  = s.breath_rate != null ? s.breath_rate + ' 回/分' : '--';
  const temp    = s.temperature != null ? s.temperature + ' °C'    : '--';
  const posture = fmtPosture(s.posture);
  const battery = s.battery    != null ? s.battery + '%'           : '--';

  if ($('sb-breath'))  $('sb-breath').textContent  = s.breath_rate ?? '--';
  if ($('sb-temp'))    $('sb-temp').textContent     = s.temperature ?? '--';
  if ($('sb-posture')) $('sb-posture').textContent  = posture;
  if ($('sb-battery')) $('sb-battery').textContent  = s.battery     ?? '--';

  if ($('sp-breath'))  $('sp-breath').textContent  = breath;
  if ($('sp-temp'))    $('sp-temp').textContent    = temp;
  if ($('sp-posture')) $('sp-posture').textContent = posture;
  if ($('sp-battery')) $('sp-battery').textContent = battery;

  if ($('sp-posture')) $('sp-posture').className = 'sp-value' + (s.posture === '俯卧' ? ' danger' : '');
  if ($('sp-breath')) {
    const r = s.breath_rate;
    $('sp-breath').className = 'sp-value' + (r != null && (r < 10 || r > 60) ? ' warn' : '');
  }
}

// ── Event icon mapping ────────────────────────────────────────────────
function eventIcon(e) {
  switch (e.type) {
    case 'formula':     return '🍼';
    case 'breastfeed':  return '🤱';
    case 'bottle_milk': return '🍶';
    case 'pump':        return '💧';
    case 'diaper':      return e.kind === 'wet' ? '💦' : '💩';
    case 'sleep':       return e.action === 'start' ? '😴' : '☀️';
    case 'bath':        return '🛁';
    case 'temperature': return '🌡️';
    case 'height':      return '📏';
    case 'weight':      return '⚖️';
    case 'note':        return '📝';
  }
  return null;
}
function eventDesc(e) {
  const m = T.pbUnitMin || '分';
  switch (e.type) {
    case 'formula':     return `${T.entryFormula} ${e.amount_ml ?? '?'}mL`;
    case 'breastfeed':  return `${T.entryBreast} ${e.duration_min || ((e.left_min||0)+(e.right_min||0))}${m}`;
    case 'bottle_milk': return `${T.entryBottle} ${e.amount_ml ?? '?'}mL`;
    case 'pump':        return `${T.entryPump} ${e.amount_ml ?? '?'}mL`;
    case 'diaper':      return e.kind === 'wet'
                          ? T.entryWet
                          : `${T.entryPoop}${e.amount ? ` (${e.amount})` : ''}`;
    case 'sleep':       return e.action === 'start'
                          ? T.entrySleep
                          : `${T.entryWake} ${e.duration_str || ''}`;
    case 'bath':        return T.entryBath;
    case 'temperature': return `${T.entryTemp} ${e.value}°C`;
    case 'height':      return `${T.entryHeight} ${e.value}cm`;
    case 'weight':      return `${T.entryWeight} ${e.value}g`;
    case 'note':        return e.text || '';
  }
  return e.type;
}

// ── Timeline rendering ────────────────────────────────────────────────
function renderTimeline(date) {
  // 每小时一根细刻度；每 6 小时为 major（粗刻度 + 数字）
  const hoursEl = $('tl-hours');
  hoursEl.innerHTML = '';
  for (let h = 0; h <= 24; h += 1) {
    const lbl = document.createElement('div');
    const isMajor = (h % 6 === 0);
    lbl.className = 'tl-hour-label' + (isMajor ? ' major' : '');
    lbl.style.left = `${(h / 24) * 100}%`;
    if (isMajor) lbl.textContent = pad2(h);
    hoursEl.appendChild(lbl);
  }

  // Segments
  const segsEl = $('tl-segs');
  segsEl.innerHTML = '';
  const segWidthPct = (SEG_S / 86400) * 100;
  _segments.forEach((seg, i) => {
    const left = tsToPercent(seg.ts, date);
    if (left < -segWidthPct || left > 100) return;
    const b = document.createElement('div');
    b.className = 'tl-seg';
    b.id = `tl-seg-${i}`;
    b.style.left  = `${Math.max(left, 0)}%`;
    b.style.width = `${Math.max(segWidthPct, 0.3)}%`;
    b.title = `${pad2(new Date(seg.ts*1000).getHours())}:${pad2(new Date(seg.ts*1000).getMinutes())}`;
    b.onclick = () => playSeg(i);
    segsEl.appendChild(b);
  });

  // Events
  const evtsEl = $('tl-events');
  evtsEl.innerHTML = '';
  let evtCount = 0;
  _events.forEach(e => {
    if (!e.ts) return;
    const left = tsToPercent(e.ts, date);
    if (left < 0 || left > 100) return;
    const icon = eventIcon(e);
    if (!icon) return;
    const el = document.createElement('div');
    el.className = 'tl-evt';
    el.style.left = `${left}%`;
    el.textContent = icon;
    el.title = `${e.time || fmtTsHM(e.ts)}  ${eventDesc(e)}`;
    el.onclick = (ev) => { ev.stopPropagation(); jumpToTs(e.ts); };
    evtsEl.appendChild(el);
    evtCount++;
  });

  // Counter —— 传感器侧改为「平均呼吸 / 平均体温 / 累计接收时长」，比写总数更直观
  let brSum = 0, brN = 0, tpSum = 0, tpN = 0;
  for (const s of _sensors) {
    if (typeof s.breath_rate === 'number') { brSum += s.breath_rate; brN++; }
    if (typeof s.temperature === 'number') { tpSum += s.temperature; tpN++; }
  }
  const avgBr = brN ? (brSum / brN).toFixed(1) : '--';
  const avgTp = tpN ? (tpSum / tpN).toFixed(1) : '--';
  // 一行 jsonl ≈ 一次成功的 BLE 轮询 → 累计有效接收时长 = count × ble_poll_interval_s
  const polledSec = _sensors.length * _blePollS;
  const ph = Math.floor(polledSec / 3600);
  const pm = Math.floor((polledSec % 3600) / 60);
  const polledStr = ph > 0 ? `${ph}${T.cdHour}${pm}${T.cdMin}` : `${pm}${T.cdMin}`;

  $('tl-counter').textContent =
    `🎬 ${_segments.length} ${T.pbCounterSegs} · 🍼💩😴 ${evtCount} ${T.pbCounterEvts} · 💨 ${avgBr} ${T.unitBpm} · 🌡️ ${avgTp}°C · 📡 ${polledStr}`;
}

// ── Update "now" red marker ───────────────────────────────────────────
function updateNowMarker() {
  if (_scrubbing) return;   // drag 期间不要被 video timeupdate 覆盖
  if (_curIdx < 0 || !_curDate) return;
  const seg = _segments[_curIdx];
  const ts  = seg.ts + ($('vid').currentTime || 0);
  const pct = tsToPercent(ts, _curDate);
  const el  = $('tl-now');
  if (pct < 0 || pct > 100) {
    el.style.display = 'none';
    return;
  }
  el.style.display = 'block';
  el.style.left = `${pct}%`;
  const bubble = $('tl-now-bubble');
  if (bubble) bubble.textContent = fmtTs(Math.floor(ts));
}

// ── Scrub: 拖动红线快速跳转 ─────────────────────────────────────
let _scrubbing = false;
let _scrubPct  = 0;

function _scrubPctFromEvent(ev) {
  const content = $('tl-content');
  if (!content) return null;
  const rect = content.getBoundingClientRect();
  const x = ev.clientX;
  if (x === undefined) return null;
  return Math.max(0, Math.min(100, (x - rect.left) / rect.width * 100));
}

function _scrubStart(ev) {
  if (_curIdx < 0 || !_curDate) return;
  ev.preventDefault();
  ev.stopPropagation();
  _scrubbing = true;
  const now = $('tl-now');
  if (now) {
    now.classList.add('scrubbing');
    try { now.setPointerCapture(ev.pointerId); } catch (_) {}
  }
  _scrubMove(ev);
}

function _scrubMove(ev) {
  if (!_scrubbing) return;
  const pct = _scrubPctFromEvent(ev);
  if (pct == null) return;
  _scrubPct = pct;
  const now = $('tl-now');
  if (!now) return;
  now.style.left = `${pct}%`;
  const ts = dayStart(_curDate) + pct / 100 * 86400;
  const bubble = $('tl-now-bubble');
  if (bubble) bubble.textContent = fmtTs(Math.floor(ts));
}

function _scrubEnd() {
  if (!_scrubbing) return;
  _scrubbing = false;
  const now = $('tl-now');
  if (now) now.classList.remove('scrubbing');
  const ts = dayStart(_curDate) + _scrubPct / 100 * 86400;
  jumpToTs(Math.round(ts));
}

function _attachScrubListeners() {
  const now = $('tl-now');
  if (!now || now.dataset.scrubBound) return;
  now.dataset.scrubBound = '1';
  now.addEventListener('pointerdown',   _scrubStart);
  now.addEventListener('pointermove',   _scrubMove);
  now.addEventListener('pointerup',     _scrubEnd);
  now.addEventListener('pointercancel', _scrubEnd);
}

// 鼠标滚轮 → 横向滚动（向下=向右）；触控板保持原生横向/纵向行为不变。
// 区分手段：触控板会触发非零 deltaX 或小幅/分数 deltaY（高频累积）；
// 鼠标滚轮一次 notch 通常给出整数且较大的 deltaY（Chrome 100、Firefox 120 等）。
function _attachRailWheel() {
  const rail = $('tl-rail');
  if (!rail || rail.dataset.wheelBound) return;
  rail.dataset.wheelBound = '1';
  rail.addEventListener('wheel', (e) => {
    if (e.deltaX !== 0) return;                         // 触控板横向滑动 → 让浏览器原生处理
    if (!Number.isInteger(e.deltaY)) return;            // 触控板纵向滑动多为分数像素 → 不拦截
    if (Math.abs(e.deltaY) < 50) return;                // 小步纵向（多见于触控板）→ 不拦截
    e.preventDefault();
    rail.scrollLeft += e.deltaY;                        // 鼠标滚轮 down → scrollLeft 增 → 向右移动
  }, { passive: false });
}

// 让 timeline 横向滚到当前红线位置（rail 内部宽度 > viewport 时）
function _scrollNowIntoView() {
  const rail = $('tl-rail'), content = $('tl-content');
  if (!rail || !content || _curIdx < 0 || !_curDate) return;
  const seg = _segments[_curIdx];
  const ts  = seg.ts + ($('vid').currentTime || 0);
  const pct = tsToPercent(ts, _curDate);
  if (pct < 0 || pct > 100) return;
  const targetX = (content.offsetWidth * pct / 100) - rail.clientWidth / 2;
  rail.scrollTo({ left: Math.max(0, targetX), behavior: 'smooth' });
}

// ── Play a segment ────────────────────────────────────────────────────
function playSeg(idx) {
  if (idx < 0 || idx >= _segments.length) return;
  _curIdx = idx;
  const seg = _segments[idx];
  const vid = $('vid');

  document.querySelectorAll('.tl-seg').forEach((b, i) => b.classList.toggle('active', i === idx));

  $('vid-placeholder').style.display = 'none';
  $('sensor-bar').style.display      = 'flex';
  vid.src = seg.url;
  vid.load();
  vid.play().catch(() => {});

  setTimecode(seg.ts);
  renderSensor(nearestSensor(seg.ts));
  updateNowMarker();
  _updateQjButtons();
  _scrollNowIntoView();
}

// ── Jump helpers ──────────────────────────────────────────────────────
function jumpToTs(targetTs) {
  if (!_segments.length) return;
  // 优先：落在某段内
  for (let i = 0; i < _segments.length; i++) {
    const diff = targetTs - _segments[i].ts;
    if (diff >= 0 && diff < SEG_S) {
      playSeg(i);
      const off = Math.max(0, Math.min(diff, SEG_S - 1));
      setTimeout(() => { $('vid').currentTime = off; }, 200);
      return;
    }
  }
  // 否则：找最近的段
  let best = 0, minDiff = Infinity;
  for (let i = 0; i < _segments.length; i++) {
    const diff = Math.abs(targetTs - _segments[i].ts);
    if (diff < minDiff) { best = i; minDiff = diff; }
  }
  playSeg(best);
}
function jumpFirst() { playSeg(0); }
function jumpLast()  { playSeg(_segments.length - 1); }
function jumpPrevSeg() { if (_curIdx > 0) playSeg(_curIdx - 1); }
function jumpNextSeg() { if (_curIdx < _segments.length - 1) playSeg(_curIdx + 1); }
function jumpRel(deltaSec) {
  if (_curIdx < 0) return;
  const seg = _segments[_curIdx];
  const target = seg.ts + Math.round($('vid').currentTime || 0) + deltaSec;
  jumpToTs(target);
}

function _updateQjButtons() {
  const first = $('qj-first'), prev = $('qj-prev'), next = $('qj-next'), last = $('qj-last');
  if (first) first.disabled = _curIdx <= 0;
  if (prev)  prev.disabled  = _curIdx <= 0;
  if (next)  next.disabled  = _curIdx < 0 || _curIdx >= _segments.length - 1;
  if (last)  last.disabled  = _curIdx < 0 || _curIdx >= _segments.length - 1;
}

// ── timeupdate handler ────────────────────────────────────────────────
function onTimeUpdate() {
  if (_curIdx < 0) return;
  const seg    = _segments[_curIdx];
  const realTs = seg.ts + Math.round(this.currentTime);
  setTimecode(realTs);
  renderSensor(nearestSensor(realTs));
  updateNowMarker();
}

// ── Load date ─────────────────────────────────────────────────────────
async function loadDate(date) {
  if (!date) return;
  _segments = [];
  _sensors  = [];
  _events   = [];
  _curIdx   = -1;
  _curDate  = date;

  const content = $('content');
  content.innerHTML = '';
  content.appendChild($('tpl-player').content.cloneNode(true));
  applyI18n(content);
  _attachScrubListeners();
  _attachRailWheel();

  $('vid').addEventListener('timeupdate', onTimeUpdate);
  $('vid').addEventListener('ended', function() {
    if (_curIdx < _segments.length - 1) playSeg(_curIdx + 1);
  });

  try {
    const [segsRes, sensRes, evtsRes] = await Promise.all([
      fetch(`/api/recordings/${date}/segments`),
      fetch(`/api/recordings/${date}/sensors`),
      fetch(`/api/log/date/${date}`),
    ]);
    _segments = await segsRes.json();
    _sensors  = await sensRes.json();
    _events   = await evtsRes.json();
  } catch(e) {
    content.innerHTML = `<div class="empty">${T.pbLoadFail}</div>`;
    return;
  }

  if (!_segments.length) {
    content.innerHTML = `<div class="empty">${T.pbNoSegments}</div>`;
    return;
  }

  renderTimeline(date);
  playSeg(_segments.length - 1);   // 默认跳到当日最新一段
}

// ── Init: load dates list ─────────────────────────────────────────────
(async () => {
  // 公共配置：拿 ble_poll_interval_s 用于 counter 行的"累计接收时长"换算
  try {
    const cfg = await (await fetch('/api/config/public')).json();
    if (cfg && typeof cfg.ble_poll_interval_s === 'number') _blePollS = cfg.ble_poll_interval_s;
  } catch(_) {}
  try {
    const dates = await (await fetch('/api/recordings')).json();
    const sel = $('date-sel');
    dates.forEach(d => {
      const opt = document.createElement('option');
      opt.value = d; opt.textContent = d;
      sel.appendChild(opt);
    });
    if (dates.length) {
      sel.value = dates[0];
      loadDate(dates[0]);
    }
  } catch(_) {}
})();
</script>
